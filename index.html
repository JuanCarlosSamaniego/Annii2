<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Anii ❤️ Nuestros 2 Meses</title>
    <style>
        :root {
            --rosa-fuerte: #ffafbd;
            --rosa-claro: #ffc3a0;
            --acento: #ff4b2b;
            --texto: #5d4037;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #fff5f5 0%, #fff0f0 100%);
            font-family: 'Georgia', serif;
            color: var(--texto);
            overflow-x: hidden;
        }

        /* --- Corazones Flotantes --- */
        .heart-bg {
            position: fixed;
            top: -10%;
            font-size: 20px;
            color: rgba(255, 175, 189, 0.4);
            user-select: none;
            z-index: 0;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* --- Pantalla de Inicio --- */
        #intro {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #ffffff, #ffe4e1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: all 1s ease;
        }

        .entrar-btn {
            padding: 18px 45px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(255, 75, 43, 0.3);
            transition: 0.3s;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        h1 { font-size: 2.8rem; color: #d81b60; text-shadow: 2px 2px 4px rgba(0,0,0,0.05); }

        /* --- Galería de 5 Fotos en Abanico --- */
        .photo-grid {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 350px;
            perspective: 1000px;
        }

        .photo-grid img {
            border-radius: 15px;
            object-fit: cover;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .img-outer { width: 12%; height: 120px; transform: rotateY(20deg) scale(0.85); opacity: 0.7; }
        .img-inner { width: 18%; height: 180px; transform: rotateY(10deg) scale(0.95); opacity: 0.9; }
        .img-main { 
            width: 32%; height: 300px; 
            z-index: 10; 
            box-shadow: 0 20px 40px rgba(216, 27, 96, 0.2) !important;
            transform: scale(1.1);
        }

        .photo-grid img:hover {
            transform: scale(1.2) rotate(0deg) !important;
            z-index: 100;
            opacity: 1;
        }

        /* --- Secciones --- */
        .month-section {
            padding: 80px 10px;
            text-align: center;
            opacity: 0; transform: translateY(30px);
            transition: 1s;
        }

        .month-section.visible { opacity: 1; transform: translateY(0); }

        .date-badge {
            background: #ffecf2;
            color: #d81b60;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px dashed #d81b60;
        }

        /* --- Lightbox --- */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 200;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center; align-items: center;
        }
        #lightbox img { max-width: 90%; max-height: 80%; border: 8px solid white; border-radius: 10px; }

        #music-container {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 400px;
            z-index: 50;
        }

        footer {
            padding: 100px 20px;
            background: linear-gradient(to bottom, transparent, #ffecf2);
            text-align: center;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="intro">
        <div style="font-size: 50px; margin-bottom: 20px;">❤️</div>
        <button class="entrar-btn" onclick="iniciarMuseo()">ABRIR CON AMOR</button>
    </div>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="img-full" src="">
    </div>

    <header>
        <h1 id="titulo-principal">Nuestra Historia Brillante</h1>
        <p style="font-style: italic;">Cada día contigo es un regalo, Anii.</p>
        <p style="font-size: 1.5rem;">✨💖✨</p>
    </header>

    <div class="timeline">
        
        <!-- MES 1 -->
        <div class="month-section">
            <span class="date-badge">PRIMER MES</span>
            <div class="photo-grid">
                <img src="foto1.jpeg" class="img-outer" onclick="verFoto(this.src)">
                <img src="foto2.jpg" class="img-inner" onclick="verFoto(this.src)">
                <img src="foto3.jpg" class="img-main" onclick="verFoto(this.src)">
                <img src="foto4.jpg" class="img-inner" onclick="verFoto(this.src)">
                <img src="foto5.jpg" class="img-outer" onclick="verFoto(this.src)">
            </div>
            <div style="margin-top: 30px;">
                <h2 style="color: #ad1457;">El inicio de todo 🌸</h2>
                <p>Donde las miradas se volvieron sonrisas.</p>
            </div>
        </div>

        <!-- MES 2 -->
        <div class="month-section">
            <span class="date-badge">SEGUNDO MES</span>
            <div class="photo-grid">
                <img src="foto11.jpg" class="img-outer" onclick="verFoto(this.src)">
                <img src="foto7.jpg" class="img-inner" onclick="verFoto(this.src)">
                <img src="foto8.jpg" class="img-main" onclick="verFoto(this.src)">
                <img src="foto9.jpg" class="img-inner" onclick="verFoto(this.src)">
                <img src="foto10.jpg" class="img-outer" onclick="verFoto(this.src)">
            </div>
            <div style="margin-top: 30px;">
                <h2 style="color: #ad1457;">Construyendo nuestro mundo 🏠</h2>
                <p>Gracias por ser mi paz y mi alegría, mi niña.</p>
            </div>
        </div>

    </div>

    <div id="music-container">
        <div id="player"></div>
    </div>

    <footer>
        <p>Te amo más de lo que las palabras pueden decir.</p>
        <p style="font-size: 2rem;">💖✨💍</p>
    </footer>

    <script>
        // Crear corazones flotantes
        function createHearts() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = ['❤️','💖','✨','🌸','💕'][Math.floor(Math.random()*5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 8000);
        }
        setInterval(createHearts, 500);

        function iniciarMuseo() {
            document.getElementById('intro').style.opacity = '0';
            setTimeout(() => document.getElementById('intro').style.display = 'none', 1000);
            
            document.getElementById('player').innerHTML = `
                <iframe allow="autoplay" frameborder="0" height="80" style="width:100%;border-radius:12px;" 
                src="https://embed.music.apple.com/mx/song/opalite/1838810953?l=en-GB&autoplay=1"></iframe>`;
        }

        function verFoto(src) {
            document.getElementById('img-full').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.month-section').forEach(m => observer.observe(m));
    </script>
</body>
</html>
